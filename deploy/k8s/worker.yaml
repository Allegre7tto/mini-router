apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: adapter
          image: mini-router-adapter:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: adapter
          env:
            - name: RUST_LOG
              value: info
            - name: WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: router
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
        - name: vllm
          image: mini-router-mock:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5557
              name: events
            - containerPort: 5558
              name: replay
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
