apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: adapter
          image: mini-router:test
          command: ["vllm-token-in-adapter"]
          ports:
            - containerPort: 8200
              name: adapter
          env:
            - name: RUST_LOG
              value: info
        - name: vllm
          image: mini-router-mock:test
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5557
              name: events
            - containerPort: 5558
              name: replay
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
