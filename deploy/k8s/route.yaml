apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model
spec:
  parentRefs:
    - name: envoy-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - name: router
          port: 8200
          kind: InferencePool
          group: inference.networking.k8s.io
