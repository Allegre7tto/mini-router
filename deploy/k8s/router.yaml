apiVersion: v1
kind: ServiceAccount
metadata:
  name: router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    resourceNames: ["router"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router
subjects:
  - kind: ServiceAccount
    name: router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      serviceAccountName: router
      containers:
        - name: router
          image: mini-router:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: epp
            - containerPort: 9001
              name: metrics
            - containerPort: 9002
              name: health
          env:
            - name: POOL
              value: router
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CERT
              value: /certs/tls.crt
            - name: KEY
              value: /certs/tls.key
            - name: RUST_LOG
              value: info
            - name: WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: router
                  key: token
          readinessProbe:
            grpc:
              port: 9002
              service: envoy.service.ext_proc.v3.ExternalProcessor
            initialDelaySeconds: 5
          livenessProbe:
            grpc:
              port: 9002
            initialDelaySeconds: 10
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: renderer
          image: mini-router-mock:test
          imagePullPolicy: IfNotPresent
          env:
            - name: MOCK_LISTEN
              value: 0.0.0.0:8100
          ports:
            - containerPort: 8100
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
      volumes:
        - name: certs
          secret:
            secretName: router-epp
---
apiVersion: v1
kind: Service
metadata:
  name: router-epp
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - port: 9000
      name: epp
      appProtocol: http2
---
apiVersion: v1
kind: Service
metadata:
  name: router-metrics
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - port: 9001
      name: metrics
