[package]
name = "transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
async-trait = "0.1"
libc = "0.2"
subtle = "2"
uuid = { version = "1.24.0", features = ["v4"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
