name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8
        with:
          toolchain: "1.94"
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --bins --all-features
      - run: docker build -f docker/router/Dockerfile -t mini-router:test .
      - run: docker build -f docker/adapter/Dockerfile -t mini-router-adapter:test .
      - run: docker build -f docker/mock/Dockerfile -t mini-router-mock:test .
      - uses: azure/setup-helm@v4.3.1
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: mini-router-test
      - run: tests/kind/setup.sh
      - run: tests/kind/verify.sh
      - if: always()
        run: tests/kind/teardown.sh
