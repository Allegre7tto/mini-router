name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8
        with:
          toolchain: "1.94"
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --bins --all-features
      - run: docker build -f docker/router/Dockerfile -t mini-router:test .
      - run: docker build -f docker/adapter/Dockerfile -t mini-router-adapter:test .
      - run: docker build -f docker/mock/Dockerfile -t mini-router-mock:test .
      - uses: azure/setup-helm@v4.3.1
      - uses: helm/kind-action@v1.12.0
        id: kind
        with:
          cluster_name: mini-router-test
      - run: tests/kind/setup.sh
      - run: tests/kind/verify.sh
      - name: Diagnose cluster failure
        if: failure() && steps.kind.outcome == 'success'
        run: |
          kubectl get pods -A -o wide || true
          kubectl get gateway,httproute,inferencepool -n mini-router -o yaml || true
          kubectl get service,endpointslice -n mini-router -o wide || true
          kubectl logs -n envoy-ai-gateway-system deployment/ai-gateway-controller --tail=60 || true
          kubectl logs -n envoy-gateway-system deployment/envoy-gateway --tail=60 || true
          kubectl logs -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=envoy-gateway --all-containers --prefix --tail=60 || true
          kubectl logs -n mini-router -l 'app in (router,worker)' --all-containers --prefix --tail=60 || true
          kubectl get events -n mini-router --field-selector type=Warning --sort-by=.metadata.creationTimestamp || true
      - if: always() && steps.kind.outcome == 'success'
        run: tests/kind/teardown.sh
